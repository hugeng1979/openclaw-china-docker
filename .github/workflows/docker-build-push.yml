name: Build and Push Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 需要写权限才能更新 Variables
      actions: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
      
      - name: 获取上游镜像最新摘要
        id: inspect-upstream
        run: |
          UPSTREAM_IMAGE="justlikemaki/openclaw-docker-cn-im:latest"
          DIGEST=$(skopeo inspect docker://$UPSTREAM_IMAGE | jq -r '.Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "上游镜像最新摘要: $DIGEST"
      
      - name: 生成当前日期
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
      
      - name: 比较变化
        id: compare
        run: |
          SHOULD_BUILD=true
          echo "开始构建镜像"
      
      - name: 登录 Docker Hub
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 构建并推送 Docker 镜像
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile2
          push: true
          tags: |
            hugeng/openclaw-china-docker2:latest
            hugeng/openclaw-china-docker2:${{ steps.date.outputs.date }}

      # 更新 GitHub Variables（使用 GitHub CLI）
      - name: 更新构建状态到 GitHub Variables
        if: steps.compare.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}  # 改用 PAT
        run: |
          # 更新上游摘要变量
          gh variable set CACHED_UPSTREAM_DIGEST --body "${{ steps.inspect-upstream.outputs.digest }}"
          # 更新 commit 变量
          gh variable set CACHED_LAST_COMMIT --body "$(git rev-parse HEAD)"
          echo "已更新 GitHub Variables"
