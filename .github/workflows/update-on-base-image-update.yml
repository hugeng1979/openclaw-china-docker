name: 当上游镜像更新时，自动构建我的镜像

on:
  # 1. (推荐) 定时触发：例如，每天 UTC 时间 0 点检查一次
  schedule:
    - cron: '0 0 * * *'
  # 2. (可选) 手动触发：方便你随时在 GitHub 页面上点击运行
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出你的代码
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 2. 恢复上次保存的上游镜像摘要缓存
      - name: 恢复上游镜像摘要缓存
        uses: actions/cache@v3
        with:
          path: upstream-digest.txt
          key: upstream-digest-cache
      
      # 3. 安装 skopeo 和 jq（用于检查镜像摘要）
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
      
      # 4. 获取上游镜像最新摘要
      - name: 获取上游镜像最新摘要
        id: inspect-upstream
        run: |
          UPSTREAM_IMAGE="justlikemaki/openclaw-docker-cn-im:latest"
          DIGEST=$(skopeo inspect docker://$UPSTREAM_IMAGE | jq -r '.Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "上游镜像最新摘要: $DIGEST"
      
      # 5. 生成当前日期（用于镜像标签）
      - name: 生成当前日期
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "当前日期: $(date +'%Y.%m.%d')"
      
      # 6. 比较上游镜像摘要，决定是否需要构建
      - name: 比较上游镜像摘要
        id: compare
        run: |
          CACHED_DIGEST=""
          if [ -f upstream-digest.txt ]; then
            CACHED_DIGEST=$(cat upstream-digest.txt)
            echo "上次构建使用的摘要: $CACHED_DIGEST"
          else
            echo "未找到缓存摘要，这是首次运行"
          fi
          
          NEW_DIGEST="${{ steps.inspect-upstream.outputs.digest }}"
          
          if [ "$CACHED_DIGEST" == "$NEW_DIGEST" ]; then
            echo "没有检测到上游镜像更新，跳过构建。"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "检测到上游镜像更新！开始构建你的镜像。"
            echo "should_build=true" >> $GITHUB_OUTPUT
            # 保存新的摘要，供下次运行使用
            echo $NEW_DIGEST > upstream-digest.txt
          fi
      
      # 7. 登录 Docker Hub
      - name: 登录 Docker Hub
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 8. 构建并推送 Docker 镜像
      - name: 构建并推送 Docker 镜像
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            hugeng/openclaw-china-docker:latest
            hugeng/openclaw-china-docker:${{ steps.date.outputs.date }}
      
      # 9. 保存本次的上游镜像摘要缓存（供下次比较使用）
      - name: 保存上游镜像摘要缓存
        if: steps.compare.outputs.should_build == 'true'
        uses: actions/cache@v3
        with:
          path: upstream-digest.txt
          key: upstream-digest-cache
