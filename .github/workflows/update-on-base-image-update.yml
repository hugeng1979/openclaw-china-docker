name: 当上游镜像更新或代码变化时，自动构建我的镜像

on:
  # 每天 UTC 时间 0 点检查一次（北京时间早上 8 点）
  schedule:
    - cron: '0 0 * * *'
  # 手动触发（方便测试）
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码（获取最新的 Dockerfile 等）
      - name: 检出代码
        uses: actions/checkout@v4
      
      # 2. 恢复上次保存的缓存（上游镜像摘要 + 上次构建时的 commit）
      - name: 恢复缓存
        uses: actions/cache@v3
        with:
          path: |
            upstream-digest.txt
            last-commit.txt
          key: build-cache
      
      # 3. 安装 skopeo 和 jq（用于检查上游镜像摘要）
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
      
      # 4. 获取上游镜像最新摘要
      - name: 获取上游镜像最新摘要
        id: inspect-upstream
        run: |
          UPSTREAM_IMAGE="justlikemaki/openclaw-docker-cn-im:latest"
          DIGEST=$(skopeo inspect docker://$UPSTREAM_IMAGE | jq -r '.Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "上游镜像最新摘要: $DIGEST"
      
      # 5. 生成当前日期（用于镜像标签）
      - name: 生成当前日期
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "当前日期: $(date +'%Y.%m.%d')"
      
      # 6. 比较变化（上游镜像摘要 和 源代码 commit）
      - name: 比较变化
        id: compare
        run: |
          # 读取上次构建时保存的上游镜像摘要
          CACHED_DIGEST=""
          if [ -f upstream-digest.txt ]; then
            CACHED_DIGEST=$(cat upstream-digest.txt)
            echo "上次构建使用的上游摘要: $CACHED_DIGEST"
          else
            echo "未找到缓存摘要，这是首次运行"
          fi
          
          NEW_DIGEST="${{ steps.inspect-upstream.outputs.digest }}"
          
          # 获取当前源代码的 commit hash（整个仓库的最新状态）
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "当前源代码 commit: $CURRENT_COMMIT"
          
          # 读取上次构建时的 commit
          CACHED_COMMIT=""
          if [ -f last-commit.txt ]; then
            CACHED_COMMIT=$(cat last-commit.txt)
            echo "上次构建时的 commit: $CACHED_COMMIT"
          fi
          
          # 判断是否需要构建
          SHOULD_BUILD=false
          
          if [ "$CACHED_DIGEST" != "$NEW_DIGEST" ]; then
            echo "✓ 检测到上游镜像有更新，需要构建"
            SHOULD_BUILD=true
          else
            echo "✗ 上游镜像无更新"
          fi
          
          if [ "$CACHED_COMMIT" != "$CURRENT_COMMIT" ]; then
            echo "✓ 检测到源代码有变化（commit 不同），需要构建"
            SHOULD_BUILD=true
          else
            echo "✗ 源代码无变化"
          fi
          
          if [ "$SHOULD_BUILD" = false ]; then
            echo "========================================="
            echo "没有检测到任何变化，跳过构建"
            echo "========================================="
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "========================================="
            echo "检测到变化，开始构建镜像"
            echo "========================================="
            echo "should_build=true" >> $GITHUB_OUTPUT
            # 保存新的摘要和 commit，供下次比较使用
            echo $NEW_DIGEST > upstream-digest.txt
            echo $CURRENT_COMMIT > last-commit.txt
          fi
      
      # 7. 登录 Docker Hub（仅在需要构建时执行）
      - name: 登录 Docker Hub
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 8. 构建并推送 Docker 镜像（仅在需要构建时执行）
      - name: 构建并推送 Docker 镜像
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            hugeng/openclaw-china-docker:latest
            hugeng/openclaw-china-docker:${{ steps.date.outputs.date }}
      
      # 9. 保存缓存（仅在构建成功后更新）
      - name: 保存缓存
        if: steps.compare.outputs.should_build == 'true'
        uses: actions/cache@v3
        with:
          path: |
            upstream-digest.txt
            last-commit.txt
          key: build-cache
