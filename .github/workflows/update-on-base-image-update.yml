name: 当上游镜像更新或代码变化时，自动构建我的镜像

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 需要写权限才能更新 Variables
      actions: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
      
      - name: 获取上游镜像最新摘要
        id: inspect-upstream
        run: |
          UPSTREAM_IMAGE="justlikemaki/openclaw-docker-cn-im:latest"
          DIGEST=$(skopeo inspect docker://$UPSTREAM_IMAGE | jq -r '.Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "上游镜像最新摘要: $DIGEST"
      
      - name: 生成当前日期
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
      
      - name: 比较变化
        id: compare
        run: |
          # 从 GitHub Variables 读取上次的上游摘要
          CACHED_DIGEST="${{ vars.CACHED_UPSTREAM_DIGEST }}"
          if [ -n "$CACHED_DIGEST" ]; then
            echo "上次构建使用的上游摘要: $CACHED_DIGEST"
          else
            echo "未找到缓存摘要，这是首次运行"
            CACHED_DIGEST=""
          fi
          
          NEW_DIGEST="${{ steps.inspect-upstream.outputs.digest }}"
          
          # 获取当前源代码的 commit hash
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "当前源代码 commit: $CURRENT_COMMIT"
          
          # 从 GitHub Variables 读取上次的 commit
          CACHED_COMMIT="${{ vars.CACHED_LAST_COMMIT }}"
          if [ -n "$CACHED_COMMIT" ]; then
            echo "上次构建时的 commit: $CACHED_COMMIT"
          else
            echo "未找到上次 commit 记录"
            CACHED_COMMIT=""
          fi
          
          SHOULD_BUILD=false
          
          if [ "$CACHED_DIGEST" != "$NEW_DIGEST" ] && [ -n "$NEW_DIGEST" ]; then
            echo "✓ 检测到上游镜像有更新，需要构建"
            SHOULD_BUILD=true
          else
            echo "✗ 上游镜像无更新"
          fi
          
          if [ "$CACHED_COMMIT" != "$CURRENT_COMMIT" ] && [ -n "$CURRENT_COMMIT" ]; then
            echo "✓ 检测到源代码有变化（commit 不同），需要构建"
            SHOULD_BUILD=true
          else
            echo "✗ 源代码无变化"
          fi
          
          if [ "$SHOULD_BUILD" = false ]; then
            echo "没有检测到任何变化，跳过构建"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "检测到变化，开始构建镜像"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 登录 Docker Hub
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 构建并推送 Docker 镜像
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hugeng/openclaw-china-docker:latest
            hugeng/openclaw-china-docker:${{ steps.date.outputs.date }}

      # 更新 GitHub Variables（使用 GitHub CLI）
      - name: 更新构建状态到 GitHub Variables
        if: steps.compare.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}  # 改用 PAT
        run: |
          # 更新上游摘要变量
          gh variable set CACHED_UPSTREAM_DIGEST --body "${{ steps.inspect-upstream.outputs.digest }}"
          # 更新 commit 变量
          gh variable set CACHED_LAST_COMMIT --body "$(git rev-parse HEAD)"
          echo "已更新 GitHub Variables"
