name: 当上游镜像更新或代码变化时，自动构建镜像

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  # 3. (可选) 当代码推送到 main/master 分支时也触发
  push:
    branches:
      - main
      - master

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 恢复缓存
        uses: actions/cache@v3
        with:
          path: |
            upstream-digest.txt
            last-commit.txt
          key: build-cache
      
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
      
      - name: 获取上游镜像最新摘要
        id: inspect-upstream
        run: |
          UPSTREAM_IMAGE="justlikemaki/openclaw-docker-cn-im:latest"
          DIGEST=$(skopeo inspect docker://$UPSTREAM_IMAGE | jq -r '.Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "上游镜像最新摘要: $DIGEST"
      
      - name: 生成当前日期
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "当前日期: $(date +'%Y.%m.%d')"
      
      - name: 比较变化
        id: compare
        run: |
          CACHED_DIGEST=""
          if [ -f upstream-digest.txt ]; then
            CACHED_DIGEST=$(cat upstream-digest.txt)
            echo "上次构建使用的上游摘要: $CACHED_DIGEST"
          else
            echo "未找到缓存摘要，这是首次运行"
          fi
          
          NEW_DIGEST="${{ steps.inspect-upstream.outputs.digest }}"
          
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "当前 commit: $CURRENT_COMMIT"
          
          CACHED_COMMIT=""
          if [ -f last-commit.txt ]; then
            CACHED_COMMIT=$(cat last-commit.txt)
            echo "上次构建使用的 commit: $CACHED_COMMIT"
          fi
          
          SHOULD_BUILD=false
          
          if [ "$CACHED_DIGEST" != "$NEW_DIGEST" ]; then
            echo "上游镜像有更新，需要构建"
            SHOULD_BUILD=true
          fi
          
          if [ "$CACHED_COMMIT" != "$CURRENT_COMMIT" ]; then
            echo "代码有变化（commit: $CURRENT_COMMIT），需要构建"
            SHOULD_BUILD=true
          fi
          
          if [ "$SHOULD_BUILD" = false ]; then
            echo "没有检测到任何变化，跳过构建"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "检测到变化，开始构建镜像"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo $NEW_DIGEST > upstream-digest.txt
            echo $CURRENT_COMMIT > last-commit.txt
          fi
      
      - name: 登录 Docker Hub
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 构建并推送 Docker 镜像
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            hugeng/openclaw-china-docker:latest
            hugeng/openclaw-china-docker:${{ steps.date.outputs.date }}
      
      - name: 保存缓存
        if: steps.compare.outputs.should_build == 'true'
        uses: actions/cache@v3
        with:
          path: |
            upstream-digest.txt
            last-commit.txt
          key: build-cache
